<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Sensi Ultra Pro</title>
    <style>
        :root {
            --primary: #ff003c;
            --bg-dark: #121214;
            --bg-card: #1a1a1e;
            --text: #ffffff;
            --text-dim: #a0a0a5;
            --success: #00ff66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: transparent;
            overflow: hidden;
        }

        /* Ícone Flutuante Inicial */
        #floating-icon {
            position: fixed;
            top: 20%;
            left: 10px;
            width: 55px;
            height: 55px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.6);
            cursor: move;
            z-index: 9999;
            border: 2px solid #fff;
        }

        /* Janela Principal do Painel */
        #main-panel {
            display: none;
            position: fixed;
            top: 10%;
            left: 10%;
            width: 340px;
            background: var(--bg-dark);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 10000;
            border: 1px solid #2a2a30;
            overflow: hidden;
        }

        /* Cabeçalho Arrastável */
        .panel-header {
            background: var(--primary);
            color: var(--text);
            padding: 12px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .close-btn {
            background: rgba(0,0,0,0.2);
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        /* Sistema de Abas */
        .tabs-menu {
            display: flex;
            background: #16161a;
            border-bottom: 1px solid #232328;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 10px 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            background: rgba(255, 0, 60, 0.05);
        }

        .tab-content {
            display: none;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: block;
        }

        /* Estilização Geral de Componentes */
        .section-title {
            font-size: 11px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .control-group {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #232328;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-dim);
        }

        .control-label span:last-child {
            color: var(--primary);
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            background: #2a2a32;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="text"] {
            width: 100%;
            background: #0d0d0f;
            border: 1px solid #2a2a32;
            padding: 10px;
            color: #fff;
            border-radius: 6px;
            outline: none;
            margin-bottom: 10px;
        }

        .output-box {
            background: #0d0d0f;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 12px;
            border-left: 3px solid var(--primary);
        }

        .output-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .output-row span:last-child {
            color: var(--success);
            font-weight: bold;
        }

        .action-btn {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
        }

        .action-btn:active { transform: scale(0.98); }

        /* Estilos do Gerador de Nick */
        .nick-item {
            background: #0d0d0f;
            padding: 8px;
            margin-top: 6px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .copy-btn {
            background: #2a2a32;
            color: #fff;
            border: none;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Estilos do Treinador de Reflexo */
        #aim-area {
            width: 100%;
            height: 180px;
            background: #0d0d0f;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            border: 1px dashed #2a2a32;
            margin-bottom: 10px;
        }
        .target {
            width: 25px;
            height: 25px;
            background: var(--primary);
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary);
        }
    </style>
</head>
<body>

    <!-- Ícone Flutuante -->
    <div id="floating-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line></svg>
    </div>

    <!-- Janela Principal -->
    <div id="main-panel">
        <div class="panel-header" id="panel-drag">
            <span>⚙️ PAINEL SENSI V10 COMPLETE</span>
            <button class="close-btn" id="close-panel">X</button>
        </div>

        <!-- Menu de Abas -->
        <div class="tabs-menu">
            <button class="tab-btn active" onclick="switchTab('tab-sensi')">🎯 Sensi</button>
            <button class="tab-btn" onclick="switchTab('tab-nicks')">🔤 Nicks</button>
            <button class="tab-btn" onclick="switchTab('tab-booster')">⚡ Booster</button>
            <button class="tab-btn" onclick="switchTab('tab-treino')">🕹️ Treino</button>
        </div>
        
        <div class="panel-body">
            <!-- ABA 1: SENSIBILIDADE -->
            <div id="tab-sensi" class="tab-content active">
                <div class="section-title">Ajustes Básicos</div>
                <div class="control-group">
                    <div class="control-label"><span>Aumento de Toque:</span><span id="sensi-val">50%</span></div>
                    <input type="range" id="sensi-slider" min="1" max="100" value="50">
                    <div class="control-label" style="margin-top: 10px;"><span>DPI Padrão do Celular:</span><span id="dpi-val">360</span></div>
                    <input type="range" id="dpi-slider" min="320" max="600" step="10" value="360">
                </div>
                <div class="section-title">Calculado para seu Sistema</div>
                <div class="control-group">
                    <div class="output-box">
                        <div class="output-row"><span>DPI Ideal p/ Aplicar:</span> <span id="out-dpi">--</span></div>
                        <div class="output-row"><span>Botão de Tiro (HUD):</span> <span id="out-botao">--</span></div>
                        <div class="output-row"><span>Velô do Ponteiro:</span> <span id="out-ponteiro">--</span></div>
                    </div>
                    <div class="output-box" style="border-left-color: var(--success); margin-top: 8px;">
                        <div class="output-row"><span>Geral:</span> <span id="out-geral">95</span></div>
                        <div class="output-row"><span>Mira Red Dot:</span> <span id="out-reddot">98</span></div>
                        <div class="output-row"><span>Miras 2x e 4x:</span> <span id="out-miras">92</span></div>
                        <div class="output-row"><span>AWM / Olhadinha:</span> <span id="out-awm">50</span></div>
                    </div>
                </div>
            </div>

            <!-- ABA 2: GERADOR DE NICKS -->
            <div id="tab-nicks" class="tab-content">
                <div class="section-title">Criador de Nomes</div>
                <input type="text" id="nick-input" placeholder="Digite seu nome aqui...">
                <div id="nick-results">
                    <!-- Resultados via JS -->
                </div>
            </div>

            <!-- ABA 3: GAME BOOSTER -->
            <div id="tab-booster" class="tab-content">
